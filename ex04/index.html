<!DOCTYPE html> 
<html lang ="en">

	<head>

		<metacharset = "UTF-8">
		<meta name "viewport" content "width = device-width, initial-scale =1.0">

		<title>The Box Model</title>
		<link rel ="stylesheet" href ="style.css">

	</head>
	
	<body>
		<main>
		    <section class ="heading">
		      <h1 id ="heading">The CSS Box Model</h1>

		      <div class ="container">
		        <article class ="box box-content">
		          <h2>content-box</h2>
		          <p>Width: 300px <br>
		          Padding: 20px | Border: 10px<br>
		          <strong>Total Width: 360px</strong><br>(width (300) + padding (20 *2) border (10*2) )</p>
		        </article>

		        <article class ="box box-border">
		          <h2>border-box</h2>
		          <p>Width: 300px<br>
		          Padding: 20px | Border: 10px<br>
		          <strong>Total Width: 300px</strong></p>
		        </article>
		      </div>
		    </section>
		  </main>
	</body>
</html>
